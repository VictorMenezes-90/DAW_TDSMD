<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Exemplo Multimídia</title>
        <link rel="stylesheet" type="text/css" href="../../styles_floating.css">
    </head>
    <body>
        <div class="ignore-css">
            <a href="../../index.html" title="Link para o Menu inicial">Multimídia II</a>
        </div>

        <figure>
            <a href="https://classroom.google.com">
            <img src="Arquivos/horizonte.png" style="border-style: solid; border-color: blue; border-width: 1px;" height="300hv" alt="Texto alternativo (FalhaAoCarregar)" title="Texto Alternativo (onMouse)">
            <figcaption>Figura 1 - "A"</figcaption>
            </a>
        </figure>

        <!-- Atributos de Vídeo:
            autoplay: Reprodução automática ao entrar no site
            controls: Controles do vídeo (Pause, play, etc ...)
            muted: Vídeo começa mudo
            looped: Vídeo em loop
            poster: a capa do vídeo
            preload: "Pré-Carregamento" do vídeo, pode ser none (nada), auto (tudo) ou metadata (infomrações importantes) quando se entra no site -->
        <video autoplay controls muted preload="metadata" poster="thumbnail.png">
            <source src="Arquivos/video.mp4" type="video/mp4">
        </video>

        <!-- Atributos de Áudio:
         Mesmos do vídeo porém não tem poster -->
        <audio controls preload="metadata">
            <source src="Arquivos/Hip Hop Sem Direitos Autorais (No Copyright).mp3" type="audio/mp3">
        </audio>

        <!-- iFrame:
         Geralmente copia-se um cóidgo em algum botão do estilo "Incorporar", pode ser um papa do Maps, um vídeo do YouTube, ou qualquer outro tipo de add-on. -->

         <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3098.2595244762506!2d-47.42488545040959!3d-22.561433300492677!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94c8806c2c324933%3A0xe2108428886c8646!2sCol%C3%A9gio%20T%C3%A9cnico%20de%20Limeira%20-%20Unicamp!5e0!3m2!1spt-BR!2sbr!4v1779894343816!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </body>
</html>
